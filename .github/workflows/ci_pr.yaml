name: CI on PR

on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black autoflake isort

      - name: Check Linting
        run: |
            chmod +x tools/check_lint.sh
            ./tools/check_lint.sh
